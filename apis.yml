aid: team8
name: Team8
description: 'Team8 is an Israel-based venture group that both creates and invests in companies, operating
  as a company-building foundry alongside a traditional venture-capital fund. Founded in 2014 by veterans
  of Israel''s elite military technology units, the firm builds and backs startups across four domains —
  Cybersecurity, Software Infrastructure, Fintech, and Digital Health — and believes the greatest successes
  emerge at their intersections. Team8 pairs founders with capital, deep operating expertise, a community
  of enterprise CISOs and executives, and a hands-on venture-creation methodology it calls "success by
  design." It does not publish a public developer API; this profile captures Team8''s corporate, portfolio,
  and insights web presence, surfaced into the API Evangelist network as a Bessemer Venture Partners
  portfolio lead.'
